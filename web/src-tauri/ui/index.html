<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NBB Treasury</title>
    <style>
      :root { color-scheme: light; --canvas: #f6f3f2; --surface: #fefcfc; --hairline: #e2dddc; --text: #201917; --text-2: #59504f; --muted: #746b69; --ink: #261d1b; --ink-text: #fcf9f9; --bad: #be2323; --brand: #d62223; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --canvas: #0e0a0a; --surface: #161312; --hairline: #2c2827; --text: #ebe7e6; --text-2: #ada6a5; --muted: #8c8483; --ink: #e8e3e2; --ink-text: #16100f; --bad: #f66d67; --brand: #ed4b43; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 18vh; background: var(--canvas); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
      .wordmark { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
      .wordmark .brand { color: var(--brand); }
      .sub { color: var(--muted); margin-top: 6px; }
      form { width: 396px; margin-top: 24px; padding: 28px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; display: grid; gap: 6px; }
      label { font-size: 12px; font-weight: 500; color: var(--text-2); }
      input { height: 34px; padding: 0 10px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
      input:focus { outline: none; border-color: var(--text); }
      button { margin-top: 16px; height: 34px; border: 0; border-radius: 6px; background: var(--ink); color: var(--ink-text); font: inherit; font-weight: 500; cursor: pointer; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
      .err { font-size: 12px; color: var(--bad); min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="wordmark"><span class="brand">NBB</span> Treasury</div>
    <div class="sub">Connect to the treasury server</div>
    <form id="f">
      <label for="url">Server address</label>
      <input id="url" value="https://treasury.nbb.internal" autofocus spellcheck="false" />
      <div class="err" id="err"></div>
      <button type="submit">Connect</button>
      <div class="hint">The address the treasury team gave you. On a development PC with the server running locally, use http://localhost:8787. The choice is remembered; the tray menu can change it.</div>
    </form>
    <script>
      const f = document.getElementById('f');
      const err = document.getElementById('err');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        try {
          await window.__TAURI__.core.invoke('connect', { url: document.getElementById('url').value });
        } catch (x) {
          err.textContent = String(x);
        }
      });
    </script>
  </body>
</html>
