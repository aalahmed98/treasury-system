[workspace]
resolver = "3"
members = ["crates/domain", "crates/alm", "crates/server", "crates/client", "crates/recon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
domain = { path = "crates/domain" }
recon = { path = "crates/recon" }
alm = { path = "crates/alm" }

# shared
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

# server
axum = "0.8.9"
tokio-stream = { version = "0.1.19", features = ["sync"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "chrono", "uuid", "rust_decimal", "json"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
dotenvy = "0.15.7"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# client
egui = "0.37.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
eventsource-stream = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
