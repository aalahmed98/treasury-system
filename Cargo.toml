[workspace]
resolver = "3"
members = ["crates/domain", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
domain = { path = "crates/domain" }

# shared
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

# server
axum = "0.8.9"
tokio-stream = { version = "0.1.19", features = ["sync"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "chrono", "uuid", "rust_decimal"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
dotenvy = "0.15.7"

# client
egui = "0.37.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
eventsource-stream = "0.2.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
