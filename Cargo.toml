[workspace]
# The desktop shell builds on Windows only (WebView2); it has its own lockfile.
exclude = ["web/src-tauri"]
resolver = "3"
members = ["crates/domain", "crates/alm", "crates/pmu", "crates/server", "crates/recon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
domain = { path = "crates/domain" }
recon = { path = "crates/recon" }
alm = { path = "crates/alm" }
pmu = { path = "crates/pmu" }

# shared
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

# server
axum = "0.8.9"
tokio-stream = { version = "0.1.19", features = ["sync"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "chrono", "uuid", "rust_decimal", "json"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "fs"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
dotenvy = "0.15.7"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
calamine = { version = "0.38", features = ["dates"] }
rust_xlsxwriter = "0.102"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The bond engine walks every lot day by day; optimise it even in development builds so the PMU
# pages stay fast while the rest of the workspace keeps quick, debuggable builds.
[profile.dev.package.pmu]
opt-level = 2
