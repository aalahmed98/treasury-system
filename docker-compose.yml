services:
  db:
    image: postgres:16
    container_name: treasury-pg
    environment:
      # The container superuser. Only db/init uses it; the application never does.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      TREASURY_OWNER_PASSWORD: ${TREASURY_OWNER_PASSWORD:?set TREASURY_OWNER_PASSWORD in .env}
      TREASURY_APP_PASSWORD: ${TREASURY_APP_PASSWORD:?set TREASURY_APP_PASSWORD in .env}
      TREASURY_RECON_PASSWORD: ${TREASURY_RECON_PASSWORD:?set TREASURY_RECON_PASSWORD in .env}
    ports:
      # Loopback only. Nothing on the LAN can reach the database. (5433 is taken by a Windows PostgreSQL service.)
      - "127.0.0.1:5434:5432"
    volumes:
      - treasury-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  treasury-pgdata:
